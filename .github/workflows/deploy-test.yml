name: Full Stack Application Deployment Test

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  COMPOSE_PROJECT_NAME: myapp

jobs:
  deploy-and-test:
    runs-on: self-hosted

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Force clean database
        run: docker compose down -v

      - name: Create .env file from secrets
        run: |
          Write-Host "Creating .env file..."
          $envContent = @"
          DB_USER=${{ secrets.DB_USER }}
          DB_PASSWORD=${{ secrets.DB_PASSWORD }}
          DB_NAME=${{ secrets.DB_NAME }}
          COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }}
          "@
          $envContent | Out-File -FilePath .env -Encoding ascii
          
          # Создаем безопасную копию для артефактов (без паролей)
          $maskedEnv = @"
          DB_USER=***
          DB_PASSWORD=***
          DB_NAME=${{ secrets.DB_NAME }}
          COMPOSE_PROJECT_NAME=${{ env.COMPOSE_PROJECT_NAME }}
          "@
          $maskedEnv | Out-File -FilePath env-masked.txt -Encoding ascii

      - name: Deploy with Docker Compose
        run: |
          docker compose up -d --build
          Start-Sleep -Seconds 20
          docker compose ps

      - name: Verify containers are running
        run: |
          $ps = docker compose ps --status running
          if ($ps -match "app" -and $ps -match "app-db") {
              Write-Host "All containers are running"
          } else {
              Write-Host "Containers failed to start"
              docker compose logs
              exit 1
          }

      - name: "Test 1: application & DB connectivity"
        run: |
          for ($i=0; $i -lt 20; $i++) {
              try {
                  $r = Invoke-WebRequest -Uri "http://localhost:8080/health" -UseBasicParsing -TimeoutSec 2
                  if ($r.StatusCode -eq 200) { break }
              } catch {
                  try {
                      $r = Invoke-WebRequest -Uri "http://localhost:8080/" -UseBasicParsing -TimeoutSec 2
                      if ($r.StatusCode -eq 200) { break }
                  } catch { Start-Sleep -Seconds 2 }
              }
          }
          $items = Invoke-RestMethod -Uri "http://localhost:8080/api/items"
          Write-Host "Application database connection working"

      - name: "Test 2: data consistency (DB vs Web API)"
        run: |
          $dbCountRaw = docker compose exec -T db psql -U "${{ secrets.DB_USER }}" -d "${{ secrets.DB_NAME }}" -t -c "SELECT COUNT(*) FROM items;"
          $dbCount = $dbCountRaw -replace '\s',''
          
          $webItems = Invoke-RestMethod -Uri "http://localhost:8080/api/items"
          $webCount = $webItems.Count
          
          Write-Host "DB: $dbCount, WEB: $webCount"
          
          "DB=$dbCount`nWEB=$webCount" | Out-File -FilePath counts.txt

          if ($dbCount -eq $webCount -and $dbCount -ne "") {
              Write-Host "Data consistency test passed"
          } else {
              exit 1
          }

      - name: Collect logs and Docker state
        if: always()
        run: |
          # Логи контейнеров
          docker compose logs *> deployment-logs.txt
          # Снимок состояния Docker
          docker compose ps -a *> docker-ps.txt
          docker images *> docker-images.txt

      - name: Create test report
        if: always()
        run: |
          $counts = Get-Content counts.txt
          $db = ($counts | Where-Object { $_ -match "^DB=" }) -replace "DB=", ""
          $web = ($counts | Where-Object { $_ -match "^WEB=" }) -replace "WEB=", ""
          
          if (-not $db) { $db = "n/a" }
          if (-not $web) { $web = "n/a" }

          $report = @"
          # Report
          - DB records: $db
          - Web API records: $web
          "@
          $report | Out-File -FilePath test-report.md -Encoding utf8

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: deployment-${{ github.run_id }}
          path: |
            env-masked.txt
            test-report.md
            deployment-logs.txt
            docker-ps.txt
            docker-images.txt
          retention-days: 30

      - name: Cleanup
        if: always()
        run: docker compose down -v
